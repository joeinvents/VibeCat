name: Build Windows installer

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron-builder's blockmap step needs Node's unflagged require(esm),
          # available from 22.12.0 onward.
          node-version: 22.x

      - run: npm ci

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: vibecat-windows-installer
          path: dist/*.exe

      - name: Upload installer to release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
